# Builds the prebuilt Windows app downloaded by site/install.ps1 and publishes it as the latest GitHub release.
# Runs on every app change merged to main, on a vX.Y.Z tag, or from the Actions tab (Run workflow).
# The release tag is the package.json version: its files are replaced until the version changes.
name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Every change to the app on main refreshes the installer's download (the site and docs do not).
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "**/*.md", ".claude/**"]

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (self-contained server)
        run: npm run build
        env:
          NEXT_OUTPUT: standalone
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Bundle runtime scripts
        run: node scripts/build-scripts.mjs

      - name: Package
        run: node scripts/package-windows.mjs

      - name: Check the archive extracts for a normal user (no links)
        shell: pwsh
        run: |
          $links = & "$env:SystemRoot\System32\tar.exe" -tvf release/career-os-windows-x64.zip | Where-Object { $_ -match '^l' }
          if ($links) { $links | Select-Object -First 10; throw "the archive contains links, which Windows cannot extract without admin rights" }

      - name: Smoke test (database, migrations, server)
        shell: pwsh
        run: |
          $stage = Resolve-Path release/career-os
          $data = Join-Path $env:RUNNER_TEMP 'career-os-data'
          @(
            'APP_PORT=3999', 'APP_BIND=127.0.0.1', 'APP_URL=http://localhost:3999',
            "CAREER_OS_DB_DIR=$($data -replace '\\','/')/db", 'DB_PORT=5499',
            'DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5499/postgres', 'DATABASE_POOL_SIZE=1',
            "DOCUMENTS_ROOT=$($data -replace '\\','/')/documents", "APP_DATA_DIR=$($data -replace '\\','/')/app",
            "BACKUPS_DIR=$($data -replace '\\','/')/backups", 'AI_PROVIDER=none'
          ) | Set-Content (Join-Path $stage '.env')
          $p = Start-Process node -ArgumentList 'scripts/start-local.mjs' -WorkingDirectory $stage -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { if ((Invoke-WebRequest -UseBasicParsing http://localhost:3999/api/health).StatusCode -eq 200) { $ok = $true; break } } catch { }
            Start-Sleep -Seconds 2
          }
          $welcome = (Invoke-WebRequest -UseBasicParsing http://localhost:3999/welcome).StatusCode
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $stage '.env') -Force
          if (-not $ok -or $welcome -ne 200) { throw "smoke test failed (health $ok, welcome $welcome)" }
          # Repack without the .env and the test data written next to the app.
          node scripts/package-windows.mjs

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $files = 'release/career-os-windows-x64.zip', 'release/career-os-windows-x64.zip.sha256'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --target $env:GITHUB_SHA --title "Career OS $version" --notes "Installation sur Windows : https://get-career-os.vercel.app" --latest
          }

      # ── Microsoft Store package, after the install command's release so a failure here never holds it back. ──
      # Identity from the repository variables (Settings → Secrets and variables → Actions → Variables), copied from
      # Partner Center → Product identity. Without them the package gets a test identity and stays out of the release.
      - name: Microsoft Store package (MSIX)
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $parts = ((Get-Content package.json -Raw | ConvertFrom-Json).version -replace '[-+].*$', '').Split('.')
          # Each Store submission needs a higher version: major.minor.<run number>.0
          $env:MSIX_VERSION = "$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER.0"
          node scripts/package-msix.mjs
          if (-not (Get-ChildItem release/career-os-*-x64.msix -ErrorAction SilentlyContinue)) { throw 'no .msix produced (makeappx missing?)' }

      - name: Smoke test the Store layout (launcher, read-only app folder)
        shell: pwsh
        run: |
          $layout = Resolve-Path release/msix/layout
          $home_ = Join-Path $env:RUNNER_TEMP 'store-home\CareerOS'
          # The Store installs the app in a folder where nothing can be created: forbid it here too.
          icacls $layout /deny '*S-1-1-0:(CI)(WD,AD,DC)' | Out-Null
          $env:CAREER_OS_HOME = $home_
          $env:CAREER_OS_NO_BROWSER = '1'
          $env:CAREER_OS_NO_DIALOG = '1'
          $p = Start-Process (Join-Path $layout 'CareerOS.exe') -PassThru
          $settings = Join-Path $home_ 'data\app\settings.env'
          $url = $null; $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            if (-not $url -and (Test-Path $settings)) { $url = ((Get-Content $settings | Where-Object { $_ -match '^APP_URL=' }) -split '=', 2)[1] }
            if ($url) { try { if ((Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 "$url/api/health").StatusCode -eq 200) { $ok = $true; break } } catch { } }
            Start-Sleep -Seconds 2
          }
          $welcome = if ($ok) { (Invoke-WebRequest -UseBasicParsing -TimeoutSec 30 "$url/welcome").StatusCode } else { 0 }
          $beat = if ($ok) { (Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 "$url/api/health?beat=1").StatusCode } else { 0 }
          # A second launch while it runs must just show it and exit cleanly (no second database).
          $second = Start-Process (Join-Path $layout 'CareerOS.exe') -PassThru
          $null = $second.WaitForExit(60000)
          $secondCode = if ($second.HasExited) { $second.ExitCode } else { 'still running' }
          Get-Content (Join-Path $home_ 'data\app\career-os.log') -ErrorAction SilentlyContinue | Select-Object -Last 30
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          icacls $layout /remove:d '*S-1-1-0' | Out-Null
          if (-not $ok -or $welcome -ne 200 -or $beat -ne 204) { throw "Store layout smoke test failed (health $ok, welcome $welcome, beat $beat)" }
          if (-not (Test-Path (Join-Path $home_ 'data\app\.heartbeat'))) { throw 'the heartbeat file was not written' }
          if ($secondCode -ne 0) { throw "a second launch did not exit cleanly ($secondCode)" }

      - name: Keep the Store package
        uses: actions/upload-artifact@v4
        with:
          name: career-os-msix
          path: release/career-os-*-x64.msix
          if-no-files-found: error

      - name: Add the Store package to the release
        if: ${{ vars.MSIX_IDENTITY_NAME != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item (Get-ChildItem release/career-os-*-x64.msix | Select-Object -First 1).FullName release/career-os-store-x64.msix
          gh release upload "v$version" release/career-os-store-x64.msix --clobber
